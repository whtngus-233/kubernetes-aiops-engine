apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiops.name" . }}
  namespace: {{ .Release.Namespace }}
---
{{- $root := . }}
{{- range $namespace := default (list .Release.Namespace) .Values.allowedNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aiops.name" $root }}
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aiops.name" $root }}
  namespace: {{ $namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aiops.name" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aiops.name" $root }}
---
{{- end }}
